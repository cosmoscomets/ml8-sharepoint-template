name: Validate SharePoint template

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate all configurations and regression cases
        shell: pwsh
        run: ./tests/Test-Configuration.Tests.ps1

      - name: Check page layouts offline
        shell: pwsh
        run: ./tests/Test-Templates.ps1

      - name: Check company branding offline
        shell: pwsh
        run: ./tests/Test-Branding.ps1

      - name: Install PowerShell analyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $results = @(
            foreach ($path in @('./scripts', './templates', './tests')) {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error
            }
          )
          $results | Format-Table
          if ($results) { throw 'PowerShell analysis failed.' }
